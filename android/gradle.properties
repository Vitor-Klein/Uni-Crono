# Balanced JVM tuning for Android/Flutter builds without aggressive RAM spikes.
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

# Keeps the daemon for faster builds, releasing memory after idle time.
org.gradle.daemon=true
org.gradle.daemon.idletimeout=60000

# Improves local build performance.
org.gradle.caching=true
org.gradle.vfs.watch=true

# Avoids common memory spikes during parallel builds.
org.gradle.parallel=false
org.gradle.workers.max=2

android.useAndroidX=true
android.enableJetifier=true
